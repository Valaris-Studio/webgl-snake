<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGL Snake</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050505;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .game-container {
      position: relative;
    }

    #glCanvas {
      display: block;
      border: 1px solid #1a1a1a;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <canvas id="glCanvas" width="640" height="640"></canvas>
    <canvas id="overlay" width="640" height="640"></canvas>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
